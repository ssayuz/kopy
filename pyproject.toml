[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kopy"
version = "0.4.0"
description = "한국어로 쓰는 파이썬"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
kopy = "kopy:cli"

[project.gui-scripts]
kopy-ide = "kopy_ide:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["kopy", "kopy_ide"]
